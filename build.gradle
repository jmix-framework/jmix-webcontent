buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'io.jmix.gradle:jmix-gradle-plugin:3.0.1'
    }
}

// Overridable so a JitPack build can publish under its own group (com.github.<owner>.<repo>). Without that,
// the starter's POM would point at io.jmix.webcontent:webcontent, which does not exist in the JitPack
// repository, and the transitive dependency would fail to resolve for consumers. Normal builds are unaffected.
group = findProperty('publishGroup') ?: 'io.jmix.webcontent'
version = findProperty('publishVersion') ?: '0.1.0'

ext {
    commonmarkVersion = '0.24.0'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'io.jmix'

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url 'https://nexus.jmix.io/repository/public'
        }
    }

    jmix {
        projectId = 'wc'
        bomVersion = '3.0.1'
    }

    group = this.group
    version = this.version


    java {
        withSourcesJar()
    }

    artifacts {
        archives sourcesJar
    }

    afterEvaluate {
        publishing {
            repositories {
                maven {
                    url = 'https://myrepo/releases/'
                    credentials {
                        username rootProject.hasProperty('uploadUser') ? rootProject['uploadUser'] : 'admin'
                        password rootProject.hasProperty('uploadPassword') ? rootProject['uploadPassword'] : 'admin'
                    }
                    allowInsecureProtocol = true
                }
            }
            publications {
                javaMaven(MavenPublication) {
                    artifactId = project.base.archivesName.get()
                    from components.java
                }
            }
        }
    }

    // remove after https://youtrack.jetbrains.com/issue/IDEA-227215 is fixed
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }
}
