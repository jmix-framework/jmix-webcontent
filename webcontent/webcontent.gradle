base {
    archivesName = 'webcontent'
}

dependencies {
    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'

    // Server-side Markdown -> HTML rendering for WebContentType.MD. 'api' because the migration
    // generator tool is run from a consumer's build and needs these on its classpath too.
    api "org.commonmark:commonmark:${commonmarkVersion}"
    api "org.commonmark:commonmark-ext-gfm-tables:${commonmarkVersion}"
    api "org.commonmark:commonmark-ext-autolink:${commonmarkVersion}"
    api "org.commonmark:commonmark-ext-heading-anchor:${commonmarkVersion}"

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-web'

    testRuntimeOnly 'org.hsqldb:hsqldb'
    // Gradle 9 no longer puts the launcher on the test classpath implicitly.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
